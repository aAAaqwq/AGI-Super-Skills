<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;500;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1440px;background:#fff8f0;overflow:hidden;position:relative;font-family:'Noto Sans SC',sans-serif}
.orange-block{position:absolute;top:0;left:0;width:100%;height:14px;background:linear-gradient(90deg,#e85d26 0%,#f48420 50%,#e85d26 100%)}
.thin-line{position:absolute;bottom:0;left:0;right:0;height:1px;background:#e8d5c0}
.content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:80px 100px 80px 120px}
.maison{font-size:20px;color:#e85d26;letter-spacing:10px;margin-bottom:100px;font-weight:500}
h1{font-size:74px;font-weight:300;line-height:1.3;color:#2c1a0a;letter-spacing:2px;margin-bottom:40px}
h1 b{font-weight:900;color:#e85d26}
.rule{width:60px;height:1px;background:#e8d5c0;margin-bottom:48px}
.intro{font-size:32px;font-weight:300;color:#8c6a4a;line-height:1.8;max-width:560px;margin-bottom:72px}
.figures{display:flex;gap:72px}
.fig .val{font-size:60px;font-weight:300;color:#2c1a0a;letter-spacing:1px}
.fig .cap{font-size:18px;color:#d4b896;letter-spacing:5px;margin-top:10px}
.marker{position:absolute;bottom:80px;right:100px;font-size:18px;color:#d4b896;letter-spacing:6px}
</style>
</head>
<body>
<div class="orange-block"></div><div class="thin-line"></div>
<div class="content">
  <div class="maison">L E  M O N D E</div>
  <h1>SpaceX 不造火箭了<br>它要做AI世界的<br><b>水电公司</b></h1>
  <div class="rule"></div>
  <p class="intro">450亿美元算力租约背后的真实棋局。当全世界还在争论「哪个大模型更强」，马斯克已经开始修AI时代的水电站。</p>
  <div class="figures">
    <div class="fig"><div class="val">22万</div><div class="cap">NVIDIA GPU</div></div>
    <div class="fig"><div class="val">$450亿</div><div class="cap">年租约</div></div>
    <div class="fig"><div class="val">1 GW</div><div class="cap">轨道算力</div></div>
  </div>
</div>
<div class="marker">2026 . 05 . 21</div>
</body>
</html>
