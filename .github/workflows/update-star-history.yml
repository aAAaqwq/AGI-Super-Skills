name: Update Star History Chart

on:
  schedule:
    - cron: '0 3 * * 1'  # Weekly on Monday at 03:00 UTC
  workflow_dispatch:       # Manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Star History SVG
        run: |
          curl -fSL -o assets/star-history.svg \
            "https://api.star-history.com/svg?repos=aAAaqwq/AGI-Super-Team&type=Date" \
            --retry 3 --retry-delay 5

      - name: Check for changes
        id: check
        run: |
          git diff --quiet assets/star-history.svg && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/star-history.svg
          git commit -m "assets: auto-update star history chart"
          git push
