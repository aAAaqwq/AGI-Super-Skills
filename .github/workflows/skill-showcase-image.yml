name: Update Skill Showcase Image

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "skills/README.md"

permissions:
  contents: write

jobs:
  update-showcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate deterministic repository contracts
        run: python3 "$GITHUB_WORKSPACE/scripts/validate_repository.py"

      - name: Count skills by category
        id: count
        run: |
          cd "$GITHUB_WORKSPACE"
          TOTAL=$(find skills -mindepth 2 -maxdepth 2 -type f -name "SKILL.md" | wc -l | tr -d ' ')
          WITH_SCRIPTS=$(find skills -type f \( -name "*.sh" -o -name "*.py" -o -name "*.js" \) \
            | wc -l | tr -d ' ')
          ZH_COUNT=$(grep -l -E "中文|小红书|抖音|公众号" skills/*/SKILL.md 2>/dev/null \
            | wc -l | tr -d ' ')

          echo "Total skills: $TOTAL"
          echo "Skills with scripts: $WITH_SCRIPTS"
          echo "Chinese content skills: $ZH_COUNT"
          {
            echo "total=$TOTAL"
            echo "with_scripts=$WITH_SCRIPTS"
            echo "zh_count=$ZH_COUNT"
          } >> "$GITHUB_OUTPUT"

      - name: Generate SVG showcase
        env:
          TOTAL: ${{ steps.count.outputs.total }}
          WITH_SCRIPTS: ${{ steps.count.outputs.with_scripts }}
          ZH_COUNT: ${{ steps.count.outputs.zh_count }}
        run: |
          cd "$GITHUB_WORKSPACE"
          CURRENT_DATE=$(date -u +%Y-%m-%d)
          cat > assets/skill-showcase.svg <<SVGEOF
          <?xml version="1.0" encoding="UTF-8"?>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
            <defs>
              <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#1a1a2e"/>
                <stop offset="100%" style="stop-color:#16213e"/>
              </linearGradient>
              <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#e94560"/>
                <stop offset="100%" style="stop-color:#0f3460"/>
              </linearGradient>
            </defs>
            <rect width="800" height="400" fill="url(#bg)"/>
            <text x="40" y="60" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">AGI Super Team</text>
            <text x="40" y="90" font-family="Arial, sans-serif" font-size="18" fill="#888888">Skills Library • Updated ${CURRENT_DATE}</text>
            <g transform="translate(40, 120)">
              <rect width="160" height="100" rx="10" fill="#0f3460"/>
              <text x="80" y="45" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#e94560" text-anchor="middle">${TOTAL}</text>
              <text x="80" y="70" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">Total Skills</text>
              <rect x="180" width="160" height="100" rx="10" fill="#0f3460"/>
              <text x="260" y="45" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#4ecca3" text-anchor="middle">${WITH_SCRIPTS}</text>
              <text x="260" y="70" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">With Scripts</text>
              <rect x="360" width="160" height="100" rx="10" fill="#0f3460"/>
              <text x="440" y="45" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ffd700" text-anchor="middle">${ZH_COUNT}</text>
              <text x="440" y="70" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">中文内容</text>
            </g>
            <g transform="translate(40, 260)">
              <rect width="720" height="8" rx="4" fill="#0f3460"/>
              <rect width="720" height="8" rx="4" fill="url(#accent)"/>
            </g>
            <text x="400" y="380" font-family="Arial, sans-serif" font-size="12" fill="#666666" text-anchor="middle">github.com/aAAaqwq/AGI-Super-Team</text>
          </svg>
          SVGEOF

      - name: Check for changes
        id: check
        run: |
          cd "$GITHUB_WORKSPACE"
          if git diff --quiet -- assets/skill-showcase.svg; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/skill-showcase.svg
          git commit -m "assets: auto-update skill showcase image"
          git push
