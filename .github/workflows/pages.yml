name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build site artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run behavior tests
        run: npm test

      - name: Enforce repository contracts
        run: npm run validate:strict

      - name: Build current repository statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_site_data.py

      - name: Refresh repository-owned README chart
        if: github.ref == 'refs/heads/main'
        run: |
          if ! jq -e '.points | length > 0' docs/data/star-history.json >/dev/null; then
            echo "No historical points available; keeping the previous README chart."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/assets/star-history.svg \
            docs/assets/star-history-dark.svg \
            docs/assets/star-history-light.svg

          if git diff --cached --quiet; then
            echo "README star history is current."
            exit 0
          fi

          git add docs/data/repo-stats.json docs/data/star-history.json
          git commit -m "chore(stats): refresh README star history [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Mark artifact as static
        run: touch docs/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Deploy last successful artifact
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
