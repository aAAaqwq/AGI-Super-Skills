name: Skill PR Review

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "skills/**"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

jobs:
  review-skill:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check out manually selected pull request head
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/pull/${{ inputs.pr_number }}/head

      - name: Validate deterministic repository contracts
        run: python3 "$GITHUB_WORKSPACE/scripts/validate_repository.py"

      - name: Get changed skill files
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            PR_NUMBER="$INPUT_PR_NUMBER"
            BASE_SHA=$(gh pr view "$PR_NUMBER" --json baseRefOid --jq .baseRefOid)
            HEAD_SHA=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)
            git fetch origin "$HEAD_SHA"
            git checkout --detach "$HEAD_SHA"
          else
            PR_NUMBER="$EVENT_PR_NUMBER"
            BASE_SHA="$EVENT_BASE_SHA"
          fi

          CHANGED_FILES=$(git diff "$BASE_SHA...HEAD" --name-only --diff-filter=AM \
            | grep -E '^skills/[^/]+/SKILL\.md$' \
            | head -10 || true)

          if [[ -z "$CHANGED_FILES" ]]; then
            echo "No skill SKILL.md files changed"
          else
            echo "Changed files:"
            echo "$CHANGED_FILES"
          fi

          {
            echo "files<<__CHANGED_SKILLS__"
            echo "$CHANGED_FILES"
            echo "__CHANGED_SKILLS__"
            echo "pr_number=$PR_NUMBER"
          } >> "$GITHUB_OUTPUT"

      - name: Review each changed skill
        if: steps.changed.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.changed.outputs.pr_number }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          cd "$GITHUB_WORKSPACE"
          if [[ -z "$ZAI_API_KEY" ]]; then
            echo "::warning::ZAI_API_KEY is unavailable; deterministic validation passed, external review skipped"
            exit 0
          fi

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            echo "=== Reviewing: $file ==="
            SKILL_NAME=$(basename "$(dirname "$file")")
            CONTENT=$(head -c 4000 "$file")
            REVIEW_PROMPT="You are reviewing a skill submission for the AGI-Super-Team repository.

          Skill: $SKILL_NAME

          Score completeness, clarity, correctness, and overall usefulness from 1-5.
          Then provide strengths, issues, and one recommendation: APPROVE, REQUEST_CHANGES, or REJECT.

          SKILL.md content:
          $CONTENT"

            REQUEST_BODY=$(jq -n \
              --arg model "glm-4" \
              --arg content "$REVIEW_PROMPT" \
              '{model: $model, max_tokens: 800, messages: [{role: "user", content: $content}]}')

            if ! RESPONSE=$(curl --fail --silent --show-error \
              --request POST \
              "https://open.bigmodel.cn/api/coding/paas/v4/chat/completions" \
              --header "Authorization: Bearer $ZAI_API_KEY" \
              --header "Content-Type: application/json" \
              --data "$REQUEST_BODY"); then
              echo "::warning::External review request failed for $SKILL_NAME"
              continue
            fi

            REVIEW_TEXT=$(jq -r '.choices[0].message.content // empty' <<< "$RESPONSE")
            if [[ -z "$REVIEW_TEXT" ]]; then
              echo "::warning::External review returned no content for $SKILL_NAME"
              continue
            fi

            COMMENT_BODY=$(printf '## Skill Review: %s\n\n%s\n\n---\n*Auto-generated by skill-pr-review workflow*' \
              "$SKILL_NAME" "$REVIEW_TEXT")
            gh pr comment "$PR_NUMBER" --body "$COMMENT_BODY"
          done <<< "$CHANGED_FILES"

      - name: No skills changed message
        if: steps.changed.outputs.files == ''
        run: echo "No SKILL.md files were changed in this PR."
